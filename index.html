  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  }

  ) {

  }

  .form-check {

    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

.text-warning,

    &lt;div class=&quot;fb-history&quot;&gt;&lt;div class=&quot;fb-history-head&quot;&gt;&lt;h3&gt;Measured demo timings&lt;/h3&gt;&lt;button type=&quot;button&quot; class=&quot;ff-text-button&quot; data-b-export disabled&gt;Results JSON&lt;/button&gt;&lt;/div&gt;&lt;table class=&quot;fb-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Regions · seed&lt;/th&gt;&lt;th&gt;DSATUR&lt;/th&gt;&lt;th&gt;Reduction&lt;br&gt;prototype&lt;/th&gt;&lt;th&gt;Runs&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody data-b-history&gt;&lt;tr&gt;&lt;td colspan=&quot;4&quot;&gt;No measurements yet.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;textarea class=&quot;fb-json&quot; data-b-json readonly rows=&quot;8&quot; aria-label=&quot;Benchmark results JSON, select and copy to save&quot; hidden&gt;&lt;/textarea&gt;&lt;/div&gt;
    &lt;details class=&quot;fb-methods&quot;&gt;&lt;summary&gt;What is being timed?&lt;/summary&gt;&lt;ul&gt;
      &lt;li&gt;Both demo methods receive identical region adjacencies, with a deterministic seed and map fingerprint. Maps are jittered square-grid Voronoi examples, not a representative collection of all planar graphs.&lt;/li&gt;
      &lt;li&gt;Two small warm-up runs per method precede measurement. Timed runs execute sequentially in a worker and alternate order. The display reports the median and range of completed trials. A 100-second solver limit ends a trial; timeouts are not successful colorings or zero times.&lt;/li&gt;
      &lt;li&gt;Solver time includes its state allocation, all reduction, search, and restoration work, and the small cost of copying and sending progress every 5 seconds. Map generation, warm-up, final data transfer, independent edge checking, and drawing are excluded.&lt;/li&gt;
      &lt;li&gt;Live maps show partial search states. Colored counts can decrease during backtracking and do not estimate time remaining. A completed coloring is marked Checked only after every shared border passes validation.&lt;/li&gt;
      &lt;li&gt;DSATUR uses iterative exact backtracking with saturation ordering. The prototype removes independent batches of vertices with at most four remaining neighbors, runs DSATUR on any leftover core, and restores using complete Kempe-component swaps.&lt;/li&gt;
      &lt;li&gt;The prototype does not implement the full catalogue, discharging, separator recursion, or certified rank scheduler of the 2026 paper. It has no near-linear runtime guarantee. Neither demo method is an implementation of Appel–Haken.&lt;/li&gt;
      &lt;li&gt;For a measured Appel–Haken versus 2026 comparison, both faithful implementations must first be built and audited. Published asymptotic bounds alone cannot determine milliseconds or real-world speedups.&lt;/li&gt;
    &lt;/ul&gt;&lt;/details&gt;
  &lt;/section&gt;
  &lt;section class=&quot;ff-about&quot; id=&quot;ff-about-panel&quot; hidden&gt;
    &lt;h2&gt;A surprisingly simple rule.&lt;/h2&gt;
    &lt;p&gt;The four color theorem says that any flat map of connected regions can be colored with at most four colors, so regions sharing a border have different colors. A corner touching another corner doesn’t count as a shared border.&lt;/p&gt;
    &lt;p&gt;“Peek at the connections” turns regions into dots and shared borders into lines. Coloring the map and coloring those dots are the same puzzle. A successful example is a demonstration, not a proof for every map.&lt;/p&gt;
    &lt;details&gt;&lt;summary&gt;About the paper and this exhibit&lt;/summary&gt;&lt;p&gt;The reviewed paper proposes removing suitable regions, coloring a smaller graph, and restoring the removed regions with coordinated recoloring. This public exhibit uses a small search solver to demonstrate map coloring. The complete paper algorithm and its remaining formal verification are separate work.&lt;/p&gt;&lt;/details&gt;
