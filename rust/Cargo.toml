[package]
name = "fourfold_engine"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "fourfold"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fourfold"
path = "src/main.rs"

[[bin]]
name = "fourfold-rsst"
path = "src/rsst_cli.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
